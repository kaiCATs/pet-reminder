name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          if (-not ($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
            choco install innosetup --yes --no-progress
          }

      - name: Validate release version
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path 'app_version.py' -Pattern 'APP_VERSION\s*=\s*["'']([^"'']+)["'']').Matches.Groups[1].Value
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version) -or $tagVersion -ne $version) {
            throw "Tag $env:RELEASE_TAG does not match APP_VERSION $version."
          }

      - name: Build application
        shell: pwsh
        run: python -m PyInstaller pet.spec --clean --noconfirm

      - name: Build GUI installer
        shell: pwsh
        env:
          PETREMINDER_SIGN_CERT_BASE64: ${{ secrets.PETREMINDER_SIGN_CERT_BASE64 }}
          PETREMINDER_SIGN_CERT_PASSWORD: ${{ secrets.PETREMINDER_SIGN_CERT_PASSWORD }}
        run: |
          $signArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PETREMINDER_SIGN_CERT_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:PETREMINDER_SIGN_CERT_PASSWORD)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'petreminder-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PETREMINDER_SIGN_CERT_BASE64))
            $password = ConvertTo-SecureString $env:PETREMINDER_SIGN_CERT_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            if (-not $certificate) {
              throw 'The code-signing certificate could not be imported.'
            }
            $signArgs = @('-Sign', '-CertificateThumbprint', $certificate.Thumbprint)
            Write-Host 'Trusted code signing certificate imported.' -ForegroundColor Green
          } else {
            Write-Host 'No signing certificate secrets configured; building an unsigned package.' -ForegroundColor Yellow
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'installer\build_gui_installer.ps1' @signArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GUI installer build failed with code $LASTEXITCODE."
          }

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath 'installer' -Filter 'PetReminder_Setup_v*_GUI.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'The GUI installer was not created.' }
          $checksum = Get-Item -LiteralPath "$($setup.FullName).sha256" -ErrorAction Stop
          $expected = (Get-Content -LiteralPath $checksum.FullName -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Installer SHA-256 verification failed.' }
          Write-Host "Verified $($setup.Name): $actual" -ForegroundColor Green

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PetReminder-${{ github.ref_name }}
          path: |
            installer/PetReminder_Setup_v*_GUI.exe
            installer/PetReminder_Setup_v*_GUI.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = Get-ChildItem -LiteralPath 'installer' -Filter 'PetReminder_Setup_v*_GUI.exe' -File | Select-Object -First 1
          $checksum = Get-Item -LiteralPath "$($setup.FullName).sha256"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          # 🐾 Pet Reminder $tag

          Automatic Windows build created by GitHub Actions.

          ## Included
          - GUI installer without a console window
          - SHA-256 checksum for installer integrity verification
          - User data remains in %APPDATA%\PetReminder

          Download the GUI installer below. The app can check future GitHub Releases from the tray menu.
          "@ | Set-Content -LiteralPath $notesPath -Encoding UTF8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName $checksum.FullName --clobber
            gh release edit $tag --title "🐾 Pet Reminder $tag – Stable Release" --notes-file $notesPath --latest
          } else {
            gh release create $tag $setup.FullName $checksum.FullName --title "🐾 Pet Reminder $tag – Stable Release" --notes-file $notesPath --latest
          }
